<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="100%" stop-color="#0f141c" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#2a364a" stroke-width="6" />

  <!-- Back Card (Shifted & Rotated slightly) -->
  <rect x="130" y="100" width="260" height="180" rx="20" fill="#253248" opacity="0.7" transform="rotate(-6 260 190)" />

  <!-- Front Active Flashcard -->
  <rect x="116" y="150" width="280" height="210" rx="22" fill="#1e293b" stroke="#3b82f6" stroke-width="4" filter="url(#shadow)" />

  <!-- Card Lines representing notes -->
  <rect x="146" y="195" width="130" height="10" rx="5" fill="#64748b" />
  <rect x="146" y="225" width="220" height="10" rx="5" fill="#475569" />
  <rect x="146" y="255" width="180" height="10" rx="5" fill="#475569" />

  <!-- Central Flash / Recall Bolt Badge -->
  <circle cx="345" cy="315" r="44" fill="url(#cardGrad)" filter="url(#shadow)" />
  <path d="M347 287 L331 317 L344 317 L341 343 L359 313 L346 313 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
</svg>
